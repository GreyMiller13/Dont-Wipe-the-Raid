name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check combat simulation
        run: node prototype/test/sim-smoke.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage game files
        run: |
          mkdir -p _site/assets/sprites
          cp -R prototype/index.html prototype/style.css prototype/css prototype/js _site/
          cp -R prototype/assets/out prototype/assets/backgrounds _site/assets/
          cp -R prototype/assets/sprites/dragon-city _site/assets/sprites/

      - name: Upload game
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: _site

      - name: Wait for the Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          : "${UPLOADED_ARTIFACT_ID:?Upload did not return an artifact ID}"
          for attempt in {1..12}; do
            if artifact_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT" --jq '.artifacts[] | select(.expired == false) | .id') \
              && [[ "$artifact_id" == "$UPLOADED_ARTIFACT_ID" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact $UPLOADED_ARTIFACT_ID did not become available"
          exit 1

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
