name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check combat simulation
        run: node prototype/test/sim-smoke.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage game files
        run: |
          mkdir -p _site/assets
          cp -R prototype/index.html prototype/style.css prototype/css prototype/js _site/
          cp -R prototype/assets/out prototype/assets/backgrounds _site/assets/

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
